version: '3.8'

services:
  db-crediya-solicitudes:
    image: postgres:17-alpine
    container_name: db-crediya-solicitudes
    environment:
      - POSTGRES_USER=crediya-solicitudes
      - POSTGRES_PASSWORD=crediya-solicitudes
      - POSTGRES_DB=crediya-solicitudes
    ports:
      - "5433:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql