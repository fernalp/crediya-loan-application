server:
  port: 8081
spring:
  application:
    name: "crediyaSolicitudes"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapters:
  r2dbc:
    host: "localhost"
    port: 5433
    schema: "public"
    database: "crediya-solicitudes"
    username: "crediya-solicitudes"
    password: "crediya-solicitudes"
  restconsumer:
    timeout: 5000
    url: "http://localhost:8080/api/v1/usuarios"
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
resilience4j:
  circuitbreaker:
    instances:
      getCustomerByIdNumber:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
springdoc:
  swagger-ui:
    path: "/api/doc/swagger-ui.html"
  api-docs:
    path: "/api/doc/api-docs"
jwt:
  secret: "db3b2c4fd9e8ee696d8e04757a66dbc658f60cfc6126fc269fb415fab1eab6c3"
adapter:
  sqs:
    region: "us-east-1"
    queueUrl: "https://sqs.us-east-1.amazonaws.com/143207289798/crediya-notifications-queue"